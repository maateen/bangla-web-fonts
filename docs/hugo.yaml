baseURL: 'https://fonts.maateen.me/'
title: Bangla Web Fonts
theme: hugo-book
defaultContentLanguage: en

copyright: "[© CC0 1.0 Universal](https://creativecommons.org/publicdomain/zero/1.0/)"

# Book configuration
disablePathToLower: true
enableGitInfo: false

# Needed for mermaid/katex shortcodes
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 1

menu:
  before:
    - name: "Home"
      pageRef: "/"
      weight: 1
  after:
    - name: "Github"
      url: "https://github.com/maateen/bangla-web-fonts"
      weight: 10

params:
  # (Optional, default light) Sets color theme: light, dark or auto.
  # Theme 'auto' switches between dark and light modes based on browser/os preferences
  BookTheme: light

  # (Optional, default true) Controls table of contents visibility on right side of pages.
  # Start and end levels can be controlled with markup.tableOfContents setting.
  # You can also specify this parameter per page in front matter.
  BookToC: true

  # (Optional, default false) Controlls breadcurms, if true breadcrumbs are displayed at the beginning of the document.
  # You can also specify this parameter per page in front matter.
  BookBreadcrumbs: true

  # (Optional, default false) Enableds incoming and outgoing links display next to table of contents on a page
  # You can also specify this parameter per page in front matter.
  BookPageLinks: true

  # (Optional, default docs) Specify root page to render child pages as menu.
  # Page is resolved by the .GetPage function.
  BookSection: '/'

  # (Optional, default 'January 2, 2006') Configure the date format used on the pages
  # - In git information
  # - In blog posts
  # https://gohugo.io/functions/time/format/
  BookDateFormat: 'January 2, 2006'

  # (Optional, default true) Enables search function with MiniSearch.
  # Index is built on fly, therefore it might slowdown your website.
  # Configuration for indexing can be adjusted in i18n folder per language.
  BookSearch: true

  # (Optional, default false) Enables comments template on pages
  # By default layouts/_partials/docs/comments.html includes Disqus template
  # See https://gohugo.io/content-management/comments/#configure-disqus
  # Can be overwritten by same param in page frontmatter
  BookComments: true

  # /!\ This is an experimental feature, might be removed or changed at any time
  # (Optional, experimental, default false) Enables portable links and link checks in markdown pages.
  # Portable links meant to work with text editors and let you write markdown without {{< relref >}} shortcode
  # Hugo Book will print warning or error if page referenced in markdown does not exists.
  # Possible values are false | 'warning' | 'error'
  BookPortableLinks: 'warning'

  # /!\ This is an experimental feature, might be removed or changed at any time
  # (Optional, experimental, default false) Enables service worker that caches
  # visited pages and resources for offline use.
  # Possible values are false | true | 'precache'
  BookServiceWorker: 'precache'
